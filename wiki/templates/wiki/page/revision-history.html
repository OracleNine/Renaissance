<table class="table">
  <thead>
    <tr>
      <th scope="col"># ID</th>
      <th scope="col">Title</th>
      <th scope="col">Created on</th>
      <th scope="col">Author</th>
    </tr>
  </thead>
  <tbody>
    {% for revision in revisionList %}
    <tr>
      <th scope="row">{{ revision.pk }}</th>
      <td>{{ revision.name }}</td>
      <td>{{ revision.created_at }}</td>
      <td>{{ revision.author }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
