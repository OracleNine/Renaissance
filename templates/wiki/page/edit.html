{% extends 'wiki/page/page-base.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}

<div class="container mx-10 p-5">
    <div id="form-body">
        <form hx-post="{% url 'wiki_save' wikiSubdomain=wikiSubdomain pageName=pageName %}">
            {{ form.media }}    
            {{ form|crispy }}
            <button class="btn btn-primary">Save</button>
        </form>
    </div>
</div>

{% endblock %}
