{% extends 'wiki/page/page-base.html' %}

{% block content %}
<div class="container mx-10 p-5">

    <h1>{{ page.name }}</h1>

    <p>{{ page.content|safe }}</p>

    <p>Watchers:
    <ul>
        {% for user in page.watchers %}
        <li>{{ user }}</li>
        {% endfor %}
    </ul>
    </p>

    <div class="btn-group">
        <a href="{% url 'wiki_edit' wikiSubdomain=wikiSubdomain pageName=pageName %}" class="btn btn-primary">Edit</a>
        <a href="#" class="btn btn-primary">Tags</a>
        <a href="#" class="btn btn-primary">Watch</a>
        <a hx-get="{% url 'wiki_view_revisions' wikiSubdomain=wikiSubdomain pageName=pageName %}" hx-target="#revision-history" class="btn btn-primary">Revisions</a>
        <a href="{% url 'wiki_discuss' wikiSubdomain=wikiSubdomain pageName=pageName %}?p=1" class="btn btn-primary">Discussion</a>
    </div>

    <div id="revision-history">

    </div>
</div>

{% endblock %}
