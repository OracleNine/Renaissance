{% extends "core/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Create a Wiki{% endblock %}

{% block content %}
<div class="container mx-10 p-5">
    <form method="POST" class="form-group">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="button" class="btn btn-primary">Create</button>
    </form>
</div>
{% endblock %}
