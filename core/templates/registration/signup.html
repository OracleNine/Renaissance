{% extends "core/base.html" %}

{% load crispy_forms_tags %}

{% block title %}Signup{% endblock %}

{% block content %}
<div class="container-sm">
    <form method="POST" class="form-group">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit">Sign up</button>
    </form>
</div>
{% endblock %}
