<form [formGroup]="createWikiForm" (ngSubmit)="onSubmit()">
    <div class="flex flex-col md:w-lg">
        @if (errorMsg()) {
        <div class="bg-red-200 rounded-md p-5 m-5">
            <p>{{ errorMsg() }}</p>
        </div>
        }
        <mat-form-field>
            <mat-label>Name</mat-label>
            <input 
            matInput
            id="name" 
            placeholder="Name"
            type="text" 
            formControlName="name"
            required />
            <mat-hint>Your wiki's name.</mat-hint>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Subdomain</mat-label>
            <input 
            matInput
            id="subdomain" 
            placeholder="Subdomain"
            type="text" 
            formControlName="subdomain"
            required />
            <mat-hint>The URL people will use to access your wiki. Only alphanumeric characters and dashes (-) are allowed.</mat-hint>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Description</mat-label>
            <textarea 
            matInput
            formControlName="description"
            id="description"></textarea>
        </mat-form-field>
    </div>
    <button matButton="filled" type="submit" [disabled]="!createWikiForm.valid">Submit</button>
</form>
