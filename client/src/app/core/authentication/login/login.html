<div class="md:flex md:justify-center md:items-center md:h-screen">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="flex flex-col md:w-lg">
      @if (errorMsg()) {
        <div class="bg-red-200 rounded-md p-5 m-5">
          <p>{{ errorMsg() }}</p>
        </div>
      }
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input 
        matInput
        id="email" 
        placeholder="you@renaissance.md"
        type="text" 
        formControlName="email"
        required />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Password: </mat-label>
        <input
        matInput 
        id="password" 
        type="password" 
        formControlName="password"
        required />
      </mat-form-field>
    </div>
    <button matButton="filled" type="submit" [disabled]="!loginForm.valid">Submit</button>

    <p>Don't have an account? <span class="text-yellow-600"><a routerLink="/register">Sign up</a></span> today.</p>
  </form>
</div>
