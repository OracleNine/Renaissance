<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <div class="flex flex-col">
    <mat-form-field>
      <mat-label>Email</mat-label>
      <input 
      matInput
      id="email" 
      placeholder="you@renaissance.md"
      type="text" 
      formControlName="email"
      required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Password: </mat-label>
      <input
      matInput 
      id="password" 
      type="password" 
      formControlName="password"
      required />
    </mat-form-field>
  </div>
  <button matButton="filled" type="submit" [disabled]="!loginForm.valid">Submit</button>
</form>
